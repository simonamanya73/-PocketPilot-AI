
name: Build PocketPilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketPilot-AI-Source.zip'
      - '.github/workflows/build-pocketpilot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o PocketPilot-AI-Source.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/pocketpilot-ai
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPilot-debug-APK
          path: source/pocketpilot-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
